# LeaderWorkerSet for the EFA multi-node E2E test.
#
# 2-pod group, each requesting vpc.amazonaws.com/efa: 1. Karpenter picks an
# EFA-capable g instance from the gpu-g NodePool (g5/g6/g6e — validated: it
# provisions g5.8xlarge, which advertises 1 EFA). Do NOT pin a specific
# instance-type: a nodeSelector on node.kubernetes.io/instance-type conflicts
# with the NodePool's instance-family requirement + the injected accelerator
# label in Karpenter's scheduling simulation ("label does not have known
# values") and the group never provisions. Let Karpenter choose.
#
# Same-AZ co-location (EFA cannot cross AZ boundaries) is enforced by the LWS
# exclusive-topology annotation, NOT Kueue TAS: the leader schedules first
# (Karpenter provisions a g-node in whatever AZ has capacity), then LWS stamps
# that AZ as a nodeSelector on the workers. This works scale-from-zero; TAS would
# deadlock (it needs g-nodes to exist before admission).
#
# Proves end-to-end: EFA device plugin advertises the resource → Kueue admits →
# both pods land in one AZ with an EFA interface allocated. Uses g-tier (EFA on
# g5/g6 large sizes), not p5 (ICE-prone, ~100x the price) — proves the EFA
# mechanism (1 EFA/node), not the 32-rail p5 topology.
#
# Substitutions: ${image}, ${namespace}, ${queue_name}
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: efa-gang-e2e
  namespace: ${namespace}
  labels:
    kueue.x-k8s.io/queue-name: ${queue_name}
  annotations:
    # AZ co-location for EFA: leader schedules first, workers inherit its zone as a
    # nodeSelector. EFA interfaces cannot cross an AZ boundary.
    leaderworkerset.sigs.k8s.io/exclusive-topology: topology.kubernetes.io/zone
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels:
          app: efa-gang-e2e
          role: leader
      spec:
        terminationGracePeriodSeconds: 5
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        containers:
          - name: efa-worker
            image: ${image}
            command: ["sh", "-c", "echo leader ready && sleep 600"]
            resources:
              requests:
                nvidia.com/gpu: "1"
                vpc.amazonaws.com/efa: "1"
                cpu: "2"
                memory: "8Gi"
              limits:
                nvidia.com/gpu: "1"
                vpc.amazonaws.com/efa: "1"
    workerTemplate:
      metadata:
        labels:
          app: efa-gang-e2e
          role: worker
      spec:
        terminationGracePeriodSeconds: 5
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        containers:
          - name: efa-worker
            image: ${image}
            command: ["sh", "-c", "echo worker ready && sleep 600"]
            resources:
              requests:
                nvidia.com/gpu: "1"
                vpc.amazonaws.com/efa: "1"
                cpu: "2"
                memory: "8Gi"
              limits:
                nvidia.com/gpu: "1"
                vpc.amazonaws.com/efa: "1"
