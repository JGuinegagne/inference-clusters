schema_version: 2
# This template declares no required variables; all values come from presets
# (engine/presets/defaults-all.tfvars). Override here for E2E if needed.
# Multinode operators (Kueue/LWS) are NOT enabled here — tests that need them
# use update_override_value to add them on top of the base cluster.
required: {}
overrides:
  # EKS cluster-admin access entries. The deploying CI caller (the e2e OIDC role) is
  # auto-merged by the template; this list adds operator roles a human uses to tear
  # the cluster down locally. Interpolated by `envsubst` from JD_E2E_VAR_ADMIN_ROLE_NAMES
  # (passed by the deploy workflow).
  admin_role_names: ${JD_E2E_VAR_ADMIN_ROLE_NAMES}
